name: CI

on:
  push:
    branches: [main]
  pull_request:
  # A package that claims support for a framework version has to keep
  # proving it after the release that broke it, not only at merge time.
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }} / ${{ matrix.dependencies }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
        laravel: ['12', '13']
        dependencies: ['highest']
        include:
          # Prove the *floor* of each constraint resolves and passes too -
          # "works on the newest 13.x" is not the same claim as "^13.0".
          - php: '8.3'
            laravel: '12'
            dependencies: 'lowest'
          - php: '8.3'
            laravel: '13'
            dependencies: 'lowest'
        exclude:
          # Laravel 13 (via orchestra/testbench 11) requires PHP 8.3+.
          - php: '8.2'
            laravel: '13'

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          # ext-zip is a hard requirement of this package: it reads .igniter
          # ZIP containers. gd/mbstring are dompdf's.
          extensions: zip, gd, mbstring, dom, fileinfo
          coverage: none
          tools: composer:v2

      - name: Pin the framework under test
        run: |
          composer require --no-update --no-interaction \
            "illuminate/support:^${{ matrix.laravel }}.0"
          composer require --dev --no-update --no-interaction \
            "orchestra/testbench:^${{ matrix.laravel == '12' && '10' || '11' }}.0"

      - name: Install dependencies
        uses: ramsey/composer-install@v3
        with:
          dependency-versions: ${{ matrix.dependencies }}

      - name: Show what actually resolved
        run: composer show | grep -E '^(illuminate/support|laravel/framework|orchestra/testbench|phpunit/phpunit|barryvdh/laravel-dompdf) '

      - name: Unit tests
        run: vendor/bin/phpunit --testsuite=Unit

      # Kept as its own step so a failure reads as "the package broke inside
      # a real Laravel app" rather than being buried in the unit output.
      - name: Integration tests (boots Laravel, renders real PDFs)
        run: vendor/bin/phpunit --testsuite=Integration

  static-analysis:
    name: PHPStan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: zip, gd, mbstring, dom, fileinfo
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        uses: ramsey/composer-install@v3
        with:
          # No composer.lock is committed for a library, so there is
          # nothing to install "locked" from.
          dependency-versions: highest

      - name: Analyse
        run: vendor/bin/phpstan analyse --no-progress --error-format=github

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: zip, gd, mbstring, dom, fileinfo
          coverage: none
          tools: composer:v2

      - name: Validate composer.json
        run: composer validate --strict

      - name: Install dependencies
        uses: ramsey/composer-install@v3
        with:
          dependency-versions: highest

      - name: Audit
        run: composer audit
